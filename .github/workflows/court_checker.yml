name: CourtReserve Availability Bot

on:
  schedule:
    # Runs every 15 minutes automatically
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual run button whenever needed

jobs:
  check-court:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install Dependencies & Playwright Browser
        run: |
          npm install playwright nodemailer
          npx playwright install chromium

      - name: Run Availability Checker
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          COURTRESERVE_USER: ${{ secrets.COURTRESERVE_USER }}
          COURTRESERVE_PASS: ${{ secrets.COURTRESERVE_PASS }}
        run: node check_court.js
