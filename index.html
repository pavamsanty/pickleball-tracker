<div class="card">
      <h2>1. Reservation Details</h2>
      <div class="grid-2">
        <div class="form-group">
          <label>Date of Play</label>
          <input type="date" id="sessionDate" />
        </div>
        <div class="form-group">
          <label>Court Cost ($)</label>
          <input type="number" id="courtCost" placeholder="60.00" step="0.01" />
        </div>
        <div class="form-group">
          <label>Start Time</label>
          <input type="time" id="sessionStartTime" value="10:00" />
        </div>
        <div class="form-group">
          <label>Duration (Hours)</label>
          <input type="number" id="sessionDuration" value="1" min="0.5" step="0.5" />
        </div>
      </div>
    </div>
